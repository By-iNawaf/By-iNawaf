<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 24" width="800" height="24" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><filter id="gl" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><linearGradient id="d" x1="0" x2="1"><stop offset="0" style="stop-color:var(--g)" stop-opacity="0"/><stop offset=".5" style="stop-color:var(--g)"/><stop offset="1" style="stop-color:var(--g)" stop-opacity="0"/></linearGradient></defs><style>:root{--g:#00ff88;--c:#00e5ff;--m:#ff2d95;--t:#c9d1d9}
