<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="By-iNawaf on GitHub" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1a0909"/><stop offset=".55" stop-color="#0b0606"/><stop offset="1" stop-color="#050304"/></linearGradient>
    <linearGradient id="ac" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d94f4f"/><stop offset="1" stop-color="#8d1f1f"/></linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2b1212"/><stop offset="1" stop-color="#120707"/></linearGradient>
    <linearGradient id="shim" gradientUnits="userSpaceOnUse" x1="270" y1="0" x2="520" y2="0">
      <stop offset="0" stop-color="#b03030"/><stop offset=".45" stop-color="#ffffff"/><stop offset="1" stop-color="#8d1f1f"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-260 0;260 0;-260 0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#d94f4f" stop-opacity="0"/><stop offset=".5" stop-color="#d94f4f" stop-opacity=".12"/><stop offset="1" stop-color="#d94f4f" stop-opacity="0"/></linearGradient>
    <linearGradient id="lyr" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a82424" stop-opacity=".38"/><stop offset="1" stop-color="#3d0d0d" stop-opacity=".12"/></linearGradient>
    <linearGradient id="bd" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8d1f1f" stop-opacity="0"/><stop offset=".5" stop-color="#ffd9d6"/><stop offset="1" stop-color="#8d1f1f" stop-opacity="0"/></linearGradient>
    <radialGradient id="g1"><stop offset="0" stop-color="#8d1f1f" stop-opacity=".5"/><stop offset="1" stop-color="#8d1f1f" stop-opacity="0"/></radialGradient>
    <radialGradient id="g2"><stop offset="0" stop-color="#b83a3a" stop-opacity=".32"/><stop offset="1" stop-color="#b83a3a" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#fff" stroke-opacity=".05"/><animateTransform attributeName="patternTransform" type="translate" from="0 0" to="32 32" dur="8s" repeatCount="indefinite"/></pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity=".25"/><stop offset=".5" stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#fff"/></linearGradient>
    <mask id="mk"><rect width="1280" height="320" fill="url(#fade)"/></mask>
    <clipPath id="r"><rect width="1280" height="320" rx="22"/></clipPath>
    <clipPath id="pill"><rect width="300" height="44" rx="22"/></clipPath>
    <path id="gh" d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"/>
    <style>
      .spin{transform-origin:148px 160px;animation:spin 26s linear infinite}
      .rev{transform-origin:148px 160px;animation:spin 40s linear infinite reverse}
      @keyframes spin{to{transform:rotate(360deg)}}
      .fa{animation:fl 6s ease-in-out infinite}.fb{animation:fl 6s ease-in-out -2s infinite}.fc{animation:fl 6s ease-in-out -4s infinite}
      @keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
      .flow{stroke-dasharray:5 9;animation:dash 1.4s linear infinite}
      @keyframes dash{to{stroke-dashoffset:-28}}
      .pu{animation:pu 5s ease-in-out infinite}@keyframes pu{0%,100%{opacity:.65}50%{opacity:1}}
      .pt{animation:up 9s linear infinite;opacity:0}
      @keyframes up{0%{transform:translateY(40px);opacity:0}15%{opacity:.8}85%{opacity:.6}100%{transform:translateY(-300px);opacity:0}}
      .sw{animation:sw 7s ease-in-out infinite}@keyframes sw{0%{transform:translateX(-500px)}60%,100%{transform:translateX(1800px)}}
      .ps{animation:ps 4.5s ease-in-out infinite}@keyframes ps{0%{transform:translateX(-120px) skewX(-20deg)}55%,100%{transform:translateX(420px) skewX(-20deg)}}
    </style>
  </defs>

  <g clip-path="url(#r)">
    <rect width="1280" height="320" fill="url(#bg)"/>
    <rect width="1280" height="320" fill="url(#grid)"/>
    <circle cx="160" cy="160" r="270" fill="url(#g1)" class="pu"><animateTransform attributeName="transform" type="translate" values="0 0;40 -20;0 0" dur="12s" repeatCount="indefinite"/></circle>
    <circle cx="1040" cy="90" r="250" fill="url(#g2)" class="pu"><animateTransform attributeName="transform" type="translate" values="0 0;-50 30;0 0" dur="14s" repeatCount="indefinite"/></circle>

    <!-- مجسّم الطبقات (يمين) -->
    <g mask="url(#mk)">
      <line x1="1010" y1="60" x2="1010" y2="270" stroke="#c64545" stroke-opacity=".5" class="flow"/>
      <g class="fc"><polygon points="1010,198 1150,238 1010,278 870,238" fill="url(#lyr)" stroke="#b03030" stroke-opacity=".55"/><polygon points="1010,214 1110,238 1010,262 910,238" fill="none" stroke="#d94f4f" stroke-opacity=".25"/></g>
      <g class="fb"><polygon points="1010,142 1150,182 1010,222 870,182" fill="url(#lyr)" stroke="#c64545" stroke-opacity=".7"/><polygon points="1010,158 1110,182 1010,206 910,182" fill="none" stroke="#d94f4f" stroke-opacity=".3"/></g>
      <g class="fa"><polygon points="1010,84 1150,124 1010,164 870,124" fill="#8d1f1f" fill-opacity=".28" stroke="#ffd9d6" stroke-opacity=".9" stroke-width="1.5"/><polygon points="1010,100 1110,124 1010,148 910,124" fill="none" stroke="#fff" stroke-opacity=".35"/>
        <circle cx="1010" cy="124" r="6" fill="#fff"/><circle cx="1010" cy="124" r="6" fill="none" stroke="#d94f4f"><animate attributeName="r" values="6;26" dur="2.4s" repeatCount="indefinite"/><animate attributeName="opacity" values=".9;0" dur="2.4s" repeatCount="indefinite"/></circle></g>
      <g fill="none" stroke="#c64545" stroke-opacity=".5"><rect x="1190" y="44" width="40" height="40" rx="10" transform="rotate(20 1210 64)" class="fb"/><rect x="760" y="215" width="52" height="52" rx="12" transform="rotate(28 786 241)" class="fa"/></g>
      <g fill="#c64545" fill-opacity=".55"><rect x="1215" y="200" width="14" height="14" rx="4" transform="rotate(15 1222 207)" class="fc"/><rect x="800" y="60" width="12" height="12" rx="3" class="fb"/></g>
    </g>

    <!-- جسيمات صاعدة -->
    <g fill="#d94f4f">
      <rect class="pt" x="520" y="300" width="5" height="5" rx="1.2" style="animation-delay:0s"/><rect class="pt" x="640" y="300" width="4" height="4" rx="1" style="animation-delay:-2s"/>
      <rect class="pt" x="760" y="300" width="6" height="6" rx="1.5" style="animation-delay:-4s"/><rect class="pt" x="900" y="300" width="4" height="4" rx="1" style="animation-delay:-6s"/>
      <rect class="pt" x="1100" y="300" width="5" height="5" rx="1.2" style="animation-delay:-1s"/><rect class="pt" x="1200" y="300" width="4" height="4" rx="1" style="animation-delay:-5s"/>
      <rect class="pt" x="330" y="300" width="4" height="4" rx="1" style="animation-delay:-3s"/><rect class="pt" x="60" y="300" width="5" height="5" rx="1.2" style="animation-delay:-7s"/>
    </g>

    <!-- مدارات الأيقونة -->
    <circle cx="148" cy="160" r="112" fill="none" stroke="#c64545" stroke-opacity=".12"/>
    <g class="spin"><circle cx="148" cy="160" r="102" fill="none" stroke="#c64545" stroke-opacity=".45" stroke-dasharray="2 9" stroke-linecap="round"/><circle cx="250" cy="160" r="5" fill="#ffd9d6"/><circle cx="250" cy="160" r="9" fill="#8d1f1f" fill-opacity=".35"/></g>
    <g class="rev"><circle cx="148" cy="160" r="88" fill="none" stroke="#b03030" stroke-opacity=".3" stroke-dasharray="26 14 4 14"/><rect x="56" y="156" width="8" height="8" rx="2" fill="#c64545"/></g>

    <!-- أيقونة القيتهب -->
    <g transform="translate(80 92)">
      <rect x="-4" y="-4" width="144" height="144" rx="36" fill="#8d1f1f" opacity=".28" class="pu"/>
      <rect x="2" y="2" width="132" height="132" rx="30" fill="url(#tile)" stroke="#d94f4f" stroke-opacity=".6" stroke-width="1.5"/>
      <rect x="14" y="14" width="108" height="108" rx="22" fill="none" stroke="#fff" stroke-opacity=".07"/>
      <g transform="translate(26 26) scale(3.5)" fill="#fff3f1"><use href="#gh"/></g>
    </g>

    <!-- النص -->
    <g font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif">
      <text x="276" y="152" font-size="64" font-weight="800" letter-spacing="-1.5" fill="#fff3f1">By-<tspan fill="url(#shim)">iNawaf</tspan></text>
      <rect x="278" y="172" width="86" height="4" rx="2" fill="url(#ac)"/><rect x="372" y="172" width="10" height="4" rx="2" fill="#b03030" opacity=".6"/><rect x="390" y="172" width="5" height="4" rx="2" fill="#b03030" opacity=".35"/>
      <g transform="translate(276 198)">
        <rect width="300" height="44" rx="22" fill="#fff" fill-opacity=".06" stroke="#fff" stroke-opacity=".2"/>
        <g clip-path="url(#pill)"><rect class="ps" x="0" y="-4" width="46" height="52" fill="#fff" fill-opacity=".14"/></g>
        <g transform="translate(15 10) scale(1)" fill="#d94f4f"><use href="#gh"/></g>
        <text x="52" y="28" font-size="17.5" font-weight="600" fill="#f0d8d6" letter-spacing=".2">github.com/By-iNawaf</text>
        <circle cx="280" cy="22" r="4" fill="#3ddc8a"><animate attributeName="opacity" values="1;.3;1" dur="1.8s" repeatCount="indefinite"/></circle>
      </g>
    </g>

    <!-- شعاع ضوء يعبر البنر -->
    <rect class="sw" x="0" y="-20" width="160" height="360" fill="url(#beam)" transform="skewX(-20)"/>

    <!-- زوايا + إطار متحرك -->
    <g fill="none" stroke="#d94f4f" stroke-opacity=".7" stroke-width="2" stroke-linecap="round"><path d="M22 52V30a8 8 0 0 1 8-8h22"/><path d="M1258 268v22a8 8 0 0 1-8 8h-22"/></g>
    <rect x=".75" y=".75" width="1278.5" height="318.5" rx="21.5" fill="none" stroke="#fff" stroke-opacity=".13" stroke-width="1.5"/>
    <rect x="1" y="1" width="1278" height="318" rx="21" fill="none" stroke="#ffd9d6" stroke-width="2" pathLength="100" stroke-dasharray="9 91" stroke-linecap="round" opacity=".85"><animate attributeName="stroke-dashoffset" from="0" to="-100" dur="8s" repeatCount="indefinite"/></rect>
  </g>
</svg>
